<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MovieMatch — Movie Explorer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <span class="brand-mark">🎬</span>
      <div>
        <h1>MovieMatch</h1>
        <p>Explore. Like. Discover.</p>
      </div>
    </div>

    <div class="search-box">
      <span class="search-icon">⌕</span>
      <input
        id="searchBar"
        type="search"
        placeholder="Search for a movie..."
        autocomplete="off"
      />
      <button id="searchButton" type="button">Search</button>
    </div>
  </header>

  <main class="page">
    <section class="explore-section">
      <div class="section-heading">
        <div>
          <span class="eyebrow">EXPLORE</span>
          <h2>Browse movies</h2>
        </div>
        <div class="results-meta">
          <span id="results-title">All Movies</span>
          <span id="results-count">0 movies</span>
        </div>
      </div>

      <div class="genre-bar">
        <button class="arrow-button" id="left-arrow" type="button" aria-label="Scroll genres left">←</button>
        <div id="keywords" class="keywords" aria-label="Movie genres"></div>
        <button class="arrow-button" id="right-arrow" type="button" aria-label="Scroll genres right">→</button>
      </div>
    </section>

    <section class="discover-section">
      <div id="status" class="status hidden" role="status"></div>
      <div id="loading" class="loading hidden">
        <div class="spinner"></div>
        <span>Loading movies...</span>
      </div>

      <div class="movie-container" id="movieContainer"></div>

      <div id="emptyState" class="empty-state hidden">
        <div class="empty-icon">🎞️</div>
        <h3>No movies found</h3>
        <p>Try another search or choose a different genre.</p>
      </div>

      <div id="pagination" class="pagination hidden" aria-label="Pagination"></div>
    </section>
  </main>

  <div class="movie-modal hidden" id="movieModal" aria-hidden="true">
    <div class="modal-backdrop" id="modalBackdrop"></div>

    <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="close-modal" id="closeModal" type="button" aria-label="Close details">×</button>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <footer class="site-footer">
    MovieMatch · Built with JavaScript & OMDb
  </footer>

  <script src="script.js"></script>
</body>
</html>
