<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Preview files with our file previewer" />
    <title>File Previewer</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1 id="main-text">File Previewer</h1>
    <div id="file-upload">
      <input type="file" id="fileInput" multiple/>
    </div>
    <main>
      <section id="file-info">
        <h2>File Information</h2>
       <div id="fileList">
        
       </div>
      </section>
      <section id="preview">
        <h2>File Preview</h2>
        <div id="filePreview"></div>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
